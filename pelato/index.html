<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTB - Idol Showdown Tournament</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="./pngtree-bald-man-head-completely-png-image_10030376.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* Palette Pastel dalla locandina */
            --bg-pink: #ffd9e8;
            /* Sfondo rosa chiaro */
            --grid-line: rgba(255, 255, 255, 0.7);
            /* Griglia bianca */
            --text-main: #5a5a7a;
            /* Testo leggibile scuro */
            --pastel-blue: #86b4f8;
            /* Blu dei riquadri */
            --pastel-yellow: #f8c858;
            /* Giallo stelle/testo */
            --glass-bg: rgba(255, 255, 255, 0.85);
            /* Effetto vetro chiaro */
            --glass-border: rgba(134, 180, 248, 0.5);
            /* Bordo azzurro */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            background-color: var(--bg-pink);
            /* Pattern a griglia stile quaderno basato sulla locandina */
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            background-attachment: fixed;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3 {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        /* --- IMMAGINE SOGGETTO (Lato Sinistro) --- */
        #bg-subject {
            position: fixed;
            top: 0;
            left: 0;
            width: 45vw;
            height: 100vh;
            /* Lasciato inalterato come richiesto */
            background-image: url('./Gemini_Generated_Image_fneicdfneicdfnei.jpeg');
            background-size: cover;
            background-position: left center;
            background-repeat: no-repeat;
            opacity: 0.15;
            /* Abbassato leggermente per non sporcare il tema chiaro */
            z-index: 1;
            -webkit-mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 100%);
            mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 100%);
        }

        /* --- LAYOUT PRINCIPALE FLUIDO --- */
        .wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: flex-end;
            min-height: 100vh;
        }

        .content-container {
            width: 100%;
            max-width: 850px;
            padding: 4rem 2rem;
            margin-right: max(2rem, 5vw);
        }

        /* --- HEADER --- */
        header {
            margin-bottom: 4rem;
            position: relative;
        }

        .title {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 2px;
            color: #ffffff;
            /* Effetto ombra spessa azzurra come il titolo "idol showdown" */
            text-shadow:
                -3px -3px 0 var(--pastel-blue),
                3px -3px 0 var(--pastel-blue),
                -3px 3px 0 var(--pastel-blue),
                3px 3px 0 var(--pastel-blue),
                0 5px 15px rgba(134, 180, 248, 0.4);
            margin-bottom: 0.5rem;
        }

        .slogan {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--pastel-yellow);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* --- SEZIONI CONTENUTO --- */
        section {
            margin-bottom: 4rem;
            position: relative;
        }

        /* Linea decorativa a sinistra aggiornata ai colori pastel */
        .neon-line-left {
            border-left: 4px solid var(--pastel-blue);
            padding-left: 1.5rem;
            position: relative;
            background: rgba(255, 255, 255, 0.5);
            padding: 1.5rem;
            border-radius: 0 15px 15px 0;
        }

        .section-title {
            font-size: 1.5rem;
            color: #ffffff;
            background-color: var(--pastel-blue);
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 20px;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(134, 180, 248, 0.3);
        }

        .section-desc {
            font-size: 1.25rem;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            max-width: 600px;
            font-weight: 500;
        }

        /* --- LISTA REGOLE --- */
        .rules-list {
            list-style: none;
            font-size: 1.3rem;
        }

        .rules-list li {
            margin-bottom: 1rem;
            padding-left: 2rem;
            position: relative;
            color: var(--pastel-blue);
            font-weight: 700;
        }

        .rules-list li::before {
            content: '⭐';
            /* Stella in stile locandina */
            position: absolute;
            left: 0;
            top: 0;
            font-size: 1.2rem;
        }

        .highlight {
            color: #444;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            font-size: 1.1rem;
        }

        /* --- GRIGLIA DETTAGLI EVENTO --- */
        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .detail-item {
            background: var(--glass-bg);
            border: 2px solid var(--pastel-blue);
            padding: 1.5rem;
            border-radius: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .detail-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(134, 180, 248, 0.2);
        }

        .detail-item h3 {
            font-size: 1rem;
            color: var(--pastel-blue);
            margin-bottom: 0.5rem;
            background: rgba(134, 180, 248, 0.1);
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
        }

        .detail-item p {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
        }

        /* --- PULSANTE MODERN --- */
        .btn-wrapper {
            margin: 2rem 0;
        }

        .btn {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
            padding: 1rem 2.5rem;
            border-radius: 30px;
            /* Arrotondato per il tema kawaii */
            background: var(--pastel-blue);
            border: 3px solid #fff;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 8px 15px rgba(134, 180, 248, 0.4);
        }

        .btn:hover {
            background: #6a9ce8;
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 12px 20px rgba(134, 180, 248, 0.6);
        }

        /* --- MODULO CHALLONGE GLASSMORPHISM --- */
        .bracket-glass-container {
            background: var(--glass-bg);
            border: 2px solid var(--pastel-blue);
            border-radius: 15px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 550px;
            border: none;
            border-radius: 8px;
            background: transparent;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            .wrapper {
                justify-content: center;
            }

            .content-container {
                margin-right: 0;
                padding: 3rem 1.5rem;
            }

            #bg-subject {
                width: 100vw;
                opacity: 0.1;
                -webkit-mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 70%);
                mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 70%);
                background-position: center top;
            }

            .title {
                font-size: 3rem;
            }

            .neon-line-left {
                border-left: none;
                background: var(--glass-bg);
                border: 2px solid var(--pastel-blue);
                border-radius: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- IMMAGINE SOGGETTO SULLO SFONDO -->
    <div id="bg-subject">
    </div>

    <div class="wrapper">
        <main class="content-container">

            <header>
                <div class="slogan">OTB PRESENTA</div>
                <h1 class="title">IDOL<br>SHOWDOWN<br><span style="font-size: 2rem;">TOURNAMENT</span></h1>
            </header>

            <!-- SEZIONE REGOLE E MAESTRO -->
            <section>
                <div class="neon-line-left">
                    <h2 class="section-title">REGOLA PRINCIPALE</h2>
                    <ul class="rules-list">
                        <li>NESSUNO DEVE SAPER GIOCARE</li>
                    </ul>
                    <p class="section-desc" style="margin-top: 1rem; margin-bottom: 0;">
                        Preparatevi al caos.
                    </p>
                </div>
            </section>

            <!-- SEZIONE INFO E ISCRIZIONE -->
            <section>
                <h2 class="section-title">DETTAGLI EVENTO</h2>

                <div class="event-grid">
                    <div class="detail-item">
                        <h3>DATA E ORA</h3>
                        <p>12.09.2026</p>
                        <p style="font-size: 1rem; color: var(--text-main);">INIZIO 20:00</p>
                    </div>
                    <div class="detail-item">
                        <h3>CASTER & LIVE</h3>
                        <p style="font-size: 1.1rem; padding-top: 5px;">sergioz • leobru • lallawaffle</p>
                        <p style="font-size: 1rem; color: var(--pastel-blue); margin-top: 5px;">▶ LIVE TWITCH</p>
                    </div>
                </div>

                <div class="btn-wrapper">
                    <!-- LINK ISCRIZIONE CHALLONGE -->
                    <a href="https://challonge.com/it/Lista_community_Sergio" target="_blank" class="btn">
                        ISCRIVITI SU CHALLONGE
                    </a>
                </div>
            </section>

            <!-- SEZIONE TABELLONE CHALLONGE -->
            <section>
                <h2 class="section-title" style="margin-top: 1rem;">TABELLONE DEL TORNEO</h2>
                <div class="bracket-glass-container">
                    <!-- IFRAME TABELLONE -->
                    <iframe src="https://challonge.com/it/Lista_community_Sergio/module" width="100%" height="500"
                        frameborder="0" scrolling="auto" allowtransparency="true"></iframe>
                </div>
            </section>

        </main>
    </div>

</body>

</html>
